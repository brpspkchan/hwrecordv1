<!-- Admin 管理頁面 HTML 結構 -->
<div class="admin-sync-panel">
  <label for="syncUrlInput">雲端同步 URL：</label>
  <input type="text" id="syncUrlInput" style="width: 400px;" placeholder="請輸入 GAS 部署網址">
  <button id="saveBtn">儲存設定</button>
  <button id="syncBtn">立即同步</button>
</div>

<script>
  // 硬編碼預設 URL
  const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbxcFkr74hwj7UZj7Z0NH5AqGsqMf5e9xlA5gDRIgsZCHFd_yf6s6lHdOGR41dtm8sJq/exec';

  const urlInput = document.getElementById('syncUrlInput');
  const saveBtn = document.getElementById('saveBtn');
  const syncBtn = document.getElementById('syncBtn');

  // 1. 頁面初始化：優先讀取本地儲存，若無則自動帶入硬編碼預設值
  function initSyncConfig() {
    const savedUrl = localStorage.getItem('admin_sync_url');
    urlInput.value = savedUrl || DEFAULT_GAS_URL;
  }

  // 2. 儲存設定
  saveBtn.addEventListener('click', () => {
    const currentInput = urlInput.value.trim();
    // 若清空則重置為預設值
    const urlToSave = currentInput || DEFAULT_GAS_URL;
    
    localStorage.setItem('admin_sync_url', urlToSave);
    urlInput.value = urlToSave;
    alert('設定已更新！');
  });

  // 3. 執行同步
  syncBtn.addEventListener('click', async () => {
    const targetUrl = localStorage.getItem('admin_sync_url') || DEFAULT_GAS_URL;
    
    try {
      const response = await fetch(targetUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' }, // GAS 跨域建議設定
        body: JSON.stringify({ action: 'sync_data', timestamp: Date.now() })
      });
      const data = await response.json();
      alert('同步成功！');
    } catch (error) {
      console.error('同步失敗：', error);
      alert('同步失敗，請確認網路連線或網址權限。');
    }
  });

  // 執行初始化
  initSyncConfig();
</script>
