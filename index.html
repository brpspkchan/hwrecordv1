<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校園功課與出席管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel Import/Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .grid-input:focus {
            outline: 2px solid #3b82f6;
            outline-offset: -2px;
        }
        .row-selected {
            background-color: #eff6ff;
        }
        .disabled-cell {
            background-color: #f3f4f6;
            color: #9ca3af;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-graduation-cap text-2xl text-amber-400"></i>
                <h1 class="text-xl font-bold tracking-wide">智慧校園功課與出席管理系統</h1>
            </div>
            
            <!-- 角色與權限切換 -->
            <div class="flex items-center space-x-4 bg-indigo-950 px-3 py-1.5 rounded-lg border border-indigo-700">
                <span class="text-xs text-indigo-300">目前權限模擬：</span>
                <select id="roleSelector" onchange="changeRole(this.value)" class="bg-indigo-900 text-white text-sm font-medium rounded border border-indigo-600 px-2 py-1 focus:outline-none">
                    <option value="Teacher">任課教師 (Teacher)</option>
                    <option value="FormTeacher">班導師 (Form Teacher - 1A)</option>
                    <option value="Admin" selected>系統管理者 (Admin)</option>
                </select>
                <div class="h-4 w-px bg-indigo-700"></div>
                <span id="userInfo" class="text-xs font-semibold text-amber-300">系統管理員 (全校權限)</span>
            </div>
        </div>
    </header>

    <!-- 主選單導覽 Tab -->
    <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 flex space-x-1">
            <button onclick="switchTab('register')" id="tab-register" class="tab-btn px-5 py-3 font-medium text-sm border-b-2 border-indigo-600 text-indigo-600 flex items-center space-x-2">
                <i class="fa-solid fa-table-cells"></i>
                <span>快速功課登記 (Data Grid)</span>
            </button>
            <button onclick="switchTab('reports')" id="tab-reports" class="tab-btn px-5 py-3 font-medium text-sm text-slate-600 hover:text-indigo-600 border-b-2 border-transparent flex items-center space-x-2">
                <i class="fa-solid fa-chart-column"></i>
                <span>欠交與出席統計</span>
            </button>
            <button onclick="switchTab('admin')" id="tab-admin" class="tab-btn px-5 py-3 font-medium text-sm text-slate-600 hover:text-indigo-600 border-b-2 border-transparent flex items-center space-x-2">
                <i class="fa-solid fa-user-gear"></i>
                <span>Admin 管理者後台</span>
            </button>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- 1. 快速登記模組 (Data Grid) -->
        <section id="view-register" class="space-y-4">
            <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 flex flex-wrap justify-between items-center gap-2">
                <div class="flex items-center space-x-2 text-indigo-900">
                    <i class="fa-solid fa-keyboard text-lg"></i>
                    <span class="font-medium text-sm">鍵盤快捷鍵：<kbd class="bg-white border border-indigo-200 rounded px-1.5 py-0.5 text-xs font-mono">Space</kbd> 切換欠交狀態 ｜ <kbd class="bg-white border border-indigo-200 rounded px-1.5 py-0.5 text-xs font-mono">↓</kbd> <kbd class="bg-white border border-indigo-200 rounded px-1.5 py-0.5 text-xs font-mono">↑</kbd> 上下移動學生列 ｜ <kbd class="bg-white border border-indigo-200 rounded px-1.5 py-0.5 text-xs font-mono">Ctrl+S</kbd> 儲存登記</span>
                </div>
                <span class="text-xs text-indigo-600 font-semibold bg-indigo-100 px-2 py-1 rounded">提示：若學生非「出席」狀態，系統將自動鎖定且不計入欠交統計</span>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">登記日期</label>
                    <input type="date" id="regDate" onchange="onRegContextChange()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">班別</label>
                    <select id="regClass" onchange="onRegContextChange()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">科目</label>
                    <select id="regSubject" onchange="onRegContextChange()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="中文">中國語文</option>
                        <option value="英文">英國語文</option>
                        <option value="數學">數學</option>
                        <option value="常識">常識 / 常規科學</option>
                        <option value="視覺藝術">視覺藝術</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">作業項目 (可新增多項同科功課)</label>
                    <div class="flex items-center space-x-1.5">
                        <input type="text" id="regTaskInput" list="commonTasks" placeholder="輸入作業名稱..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <button type="button" onclick="addRegTaskItem()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg text-xs font-semibold whitespace-nowrap shadow-sm">
                            <i class="fa-solid fa-plus mr-1"></i>加入項目
                        </button>
                        <datalist id="commonTasks">
                            <option value="單元一工作紙">
                            <option value="習作簿 P.10-12">
                            <option value="默書查閱本">
                            <option value="隨堂小測驗">
                            <option value="專題報告提交">
                        </datalist>
                    </div>
                </div>
            </div>

            <!-- 本次欲登記之功課標籤與今日已登記清單 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <div class="flex flex-wrap items-center gap-2">
                    <span class="text-xs font-bold text-slate-600 mr-1"><i class="fa-solid fa-list-check text-indigo-600 mr-1"></i>準備登記之功課項目：</span>
                    <div id="activeTaskChips" class="flex flex-wrap items-center gap-1.5">
                        <!-- 動態產生標籤 -->
                    </div>
                </div>

                <div id="todaySavedTasksArea" class="pt-2 border-t border-slate-100 flex flex-wrap items-center gap-2 text-xs text-slate-600">
                    <span class="font-bold text-emerald-700"><i class="fa-solid fa-circle-check mr-1"></i>今日該科已登記功課：</span>
                    <div id="todaySavedTasksList" class="flex flex-wrap items-center gap-2">
                        <!-- 動態顯示已儲存作業 -->
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-3 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                    <div class="flex items-center space-x-4">
                        <span class="text-sm font
